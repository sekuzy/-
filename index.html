<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кофейный мир — загрузка</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#140d09;color:#f3e7dc;font-family:Arial,sans-serif}.loader{width:min(520px,calc(100% - 40px));text-align:center}.cup{font-size:54px}.bar{height:8px;border-radius:99px;background:#3a261a;overflow:hidden;margin:22px 0}.bar i{display:block;height:100%;width:45%;background:#d99a45;border-radius:inherit;animation:m 1.15s infinite alternate}@keyframes m{to{transform:translateX(122%)}}small{color:#c8b8ab}.error{display:none;color:#ffb4a8;line-height:1.55}</style></head><body><main class="loader"><div class="cup">☕</div><h1>Кофейный мир</h1><p>Загружаем проверенную web-версию…</p><div class="bar"><i></i></div><small>Каталог, корзина, оформление, аренда, сервис и личный кабинет</small><p class="error" id="error"></p></main><script>(async()=>{try{const names=['bundle/part00.txt','bundle/part01.txt','bundle/part02.txt'];const chunks=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Не загружен '+n);return r.text()})));const b64=chunks.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Обновите браузер Chrome, Edge или Firefox');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){const n=document.getElementById('error');n.style.display='block';n.textContent='Не удалось загрузить сайт: '+e.message+'. Обновите страницу через Ctrl+F5.'}})();</script></body></html>
